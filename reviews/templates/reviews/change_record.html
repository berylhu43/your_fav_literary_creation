{% extends 'base.html' %}

{% block title %}Edit review{% endblock %}

{% block content %}
  <h1>Edit your review of "{{ review.catalog.title }}"</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save changes</button>
  </form>

  <p><a href="{% url 'reviews:my_records' %}">Cancel</a></p>
{% endblock %}
