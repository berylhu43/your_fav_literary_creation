{% load static %}
<div style="width:{{ width|default:'92px' }}; flex-shrink:0">
  {% if url %}
    <img src="{{ url }}" alt="{{ alt|default:'' }}" style="width:100%; display:block">
  {% elif media_type == 'book' %}
    <img src="{% static 'catalog/img/book_placeholder_128.png' %}" alt="" style="width:100%; display:block">
  {% else %}
    <img src="{% static 'catalog/img/poster_placeholder_185.png' %}" alt="" style="width:100%; display:block">
  {% endif %}
</div>
