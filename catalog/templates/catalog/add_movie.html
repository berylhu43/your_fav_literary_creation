{% extends 'base.html' %}
{% block title %}Rate this movie{% endblock %}

{% block content %}
  <h1>Add your rating & review</h1>

  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
{% endblock %}
