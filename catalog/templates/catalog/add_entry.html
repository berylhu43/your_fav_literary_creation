{% extends 'base.html' %}

{% block title %}Add Entry{% endblock %}

{% block content %}
  <h1>Add a movie, show, or book</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>

  <p><a href="{% url 'home' %}">Cancel</a></p>
{% endblock %}
